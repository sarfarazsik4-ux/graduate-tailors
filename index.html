<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graduate Tailors | Since 1991</title>
  <style>
    *{box-sizing:border-box;font-family:Arial,sans-serif}
    body{margin:0;background:#111;color:#fff}
    header{background:#000;padding:20px;text-align:center;border-bottom:2px solid #d4af37}
    header h1{margin:0;color:#d4af37}
    header p{margin:5px 0;color:#ccc}
    .hero{padding:50px 20px;text-align:center;background:linear-gradient(135deg,#1a1a1a,#000)}
    .hero h2{color:#d4af37;font-size:36px;margin-bottom:10px}
    .container{max-width:900px;margin:auto;padding:20px}
    .card{background:#1b1b1b;padding:20px;border-radius:14px;margin-bottom:20px;border:1px solid #333}
    label{display:block;margin:12px 0 6px;color:#d4af37;font-weight:bold}
    input,select,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #555;background:#222;color:#fff}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
    .btn{display:inline-block;background:#d4af37;color:#000;padding:14px 22px;border-radius:10px;text-decoration:none;font-weight:bold;border:none;cursor:pointer;width:100%;margin-top:15px}
    .review{background:#000;border:1px solid #d4af37;padding:15px;border-radius:10px;white-space:pre-line}
    footer{text-align:center;padding:20px;color:#aaa;border-top:1px solid #333}
    @media(max-width:700px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body>

<header>
  <h1>Graduate Tailors</h1>
  <p>Since 1991 | Sikandra, Jamui - 811315</p>
  <p>📞 9801408188</p>
</header>

<section class="hero">
  <h2>Custom Men's Tailoring</h2>
  <p>Perfect Fit. Perfect Style.</p>
</section>

<div class="container">

  <div class="card">
    <h3>Select Product</h3>
    <select id="product">
      <option>Shirt - ₹300</option>
      <option>Pant - ₹400</option>
      <option>Suit - ₹3500</option>
      <option>Blazer - ₹4000</option>
    </select>

    <label>Fabric</label>
    <select id="fabric">
      <option>Pure Cotton</option>
      <option>Poly Cotton</option>
      <option>Linen</option>
      <option>Khadi</option>
      <option>Polyester</option>
      <option>Rayon</option>
      <option>Oxford</option>
      <option>Poplin</option>
      <option>Twill</option>
      <option>Denim</option>
      <option>Wool Blend</option>
      <option>Satin</option>
    </select>
  </div>

  <div class="card">
    <h3>Choose Colors</h3>
    <div class="row">
      <div>
        <label>Shirt Color</label>
        <select id="shirtColor">
          <option>White</option>
          <option>Black</option>
          <option>Navy</option>
          <option>Sky Blue</option>
          <option>Grey</option>
          <option>Cream</option>
          <option>Maroon</option>
        </select>
      </div>
      <div>
        <label>Pant Color</label>
        <select id="pantColor">
          <option>Black</option>
          <option>Navy</option>
          <option>Grey</option>
          <option>Charcoal</option>
          <option>Khaki</option>
          <option>Beige</option>
          <option>Brown</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>Size Selection</h3>
    <label>Choose Size</label>
    <select id="sizeType" onchange="toggleManual()">
      <option value="standard">Standard Size</option>
      <option value="manual">Manual Measurement</option>
    </select>

    <div id="standardSize">
      <label>Standard Size</label>
      <select id="stdSize">
        <option>S</option>
        <option>M</option>
        <option>L</option>
        <option>XL</option>
        <option>XXL</option>
      </select>
    </div>

    <div id="manualSize" style="display:none">
      <div class="row">
        <div><label>Chest (in)</label><input id="chest" type="number"></div>
        <div><label>Waist (in)</label><input id="waist" type="number"></div>
        <div><label>Shoulder (in)</label><input id="shoulder" type="number"></div>
        <div><label>Sleeve (in)</label><input id="sleeve" type="number"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>Customer Details</h3>
    <label>Full Name</label>
    <input id="name" type="text" placeholder="Enter your name">

    <label>Mobile Number</label>
    <input id="mobile" type="tel" placeholder="Enter mobile number">

    <label>Address</label>
    <textarea id="address" rows="3" placeholder="Enter address"></textarea>
  </div>

  <div class="card">
    <button class="btn" onclick="showReview()">Review Order</button>
    <div id="reviewBox" class="review" style="display:none"></div>
    <a id="waBtn" class="btn" style="display:none" target="_blank">Confirm & Send on WhatsApp</a>
  </div>

</div>

<footer>
  © 2026 Graduate Tailors | Since 1991
</footer>

<script>
function toggleManual(){
  const type=document.getElementById('sizeType').value;
  document.getElementById('manualSize').style.display = type==='manual' ? 'block' : 'none';
  document.getElementById('standardSize').style.display = type==='standard' ? 'block' : 'none';
}

function showReview(){
  const product=document.getElementById('product').value;
  const fabric=document.getElementById('fabric').value;
  const shirtColor=document.getElementById('shirtColor').value;
  const pantColor=document.getElementById('pantColor').value;
  const sizeType=document.getElementById('sizeType').value;
  const stdSize=document.getElementById('stdSize').value;
  const name=document.getElementById('name').value;
  const mobile=document.getElementById('mobile').value;
  const address=document.getElementById('address').value;

  let sizeInfo='';
  if(sizeType==='standard'){
    sizeInfo='Standard Size: '+stdSize;
  }else{
    sizeInfo=
      'Chest: '+document.getElementById('chest').value+' in\\n'+
      'Waist: '+document.getElementById('waist').value+' in\\n'+
      'Shoulder: '+document.getElementById('shoulder').value+' in\\n'+
      'Sleeve: '+document.getElementById('sleeve').value+' in';
  }

  const review=
`Graduate Tailors - Order Review

Product: ${product}
Fabric: ${fabric}
Shirt Color: ${shirtColor}
Pant Color: ${pantColor}

${sizeInfo}

Name: ${name}
Mobile: ${mobile}
Address: ${address}`;

  const box=document.getElementById('reviewBox');
  box.style.display='block';
  box.textContent=review;

  const msg=encodeURIComponent(review);
  const wa='https://wa.me/919801408188?text='+msg;
  const waBtn=document.getElementById('waBtn');
  waBtn.href=wa;
  waBtn.style.display='inline-block';
}
</script>

</body>
</html>
