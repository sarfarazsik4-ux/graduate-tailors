<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order - Graduate Tailors</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<div class="logo">Graduate <span>Tailors</span></div>

<nav>
<a href="index.html">Home</a>
<a href="order.html">Order</a>
</nav>
</header>

<section style="padding-top:120px">

<h2 class="title">Design Your Outfit</h2>
<div class="card">

<h2>Customer Details</h2>

<input type="text" id="customerName" placeholder="Full Name">

<br><br>

<input type="tel" id="customerPhone" placeholder="Mobile Number">

<br><br>

<input type="email" id="customerEmail" placeholder="Email (Optional)">

</div>

<br>
<div class="card">

<label><b>Select Product</b></label>

<select id="product">
<option>Shirt</option>
<option>Pant</option>
<option>Suit</option>
<option>Blazer</option>
</select>

<br><br>

<label><b>Select Fabric</b></label>

<select id="fabric">

<option>Pure Cotton</option>
<option>Egyptian Cotton</option>
<option>Linen</option>
<option>Khadi</option>
<option>Oxford</option>
<option>Poplin</option>
<option>Twill</option>
<option>Chambray</option>
<option>Denim</option>
<option>Rayon</option>
<option>Poly Cotton</option>
<option>Polyester</option>
<option>Viscose</option>
<option>Wool</option>
<option>Silk Blend</option>

</select>

</select>

<br><br>

<label><b>Shirt Colour</b></label>

<input type="color" id="shirtColor">

<br><br>

<label><b>Pant Colour</b></label>

<input type="color" id="pantColor">

<br><br>

<label><b>Select Size</b></label>

<select id="size">

<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>

</select>

<br><br>

<h3>OR Manual Measurements</h3>

<input type="number" placeholder="Chest (inches)"><br><br>

<input type="number" placeholder="Waist (inches)"><br><br>

<input type="number" placeholder="Shoulder (inches)"><br><br>

<input type="number" placeholder="Sleeve Length"><br><br>

<input type="number" placeholder="Pant Length"><br><br>

<button class="btn">
Review Order
</button>

</div>

</section>

<footer>

<h3>Graduate Tailors</h3>

<p>Since 1991</p>

</footer>

</body>
</html>
