<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order - Graduate Tailors</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">Graduate <span>Tailors</span></div>

    <nav>
        <a href="index.html">Home</a>
        <a href="order.html">Order</a>
        <a href="review.html">Reviews</a>
    </nav>
</header>

<section style="padding-top:120px">

<h2 class="title">Design Your Outfit</h2>

<div class="card">

<h2>Customer Details</h2>

<input type="text" id="customerName" placeholder="Full Name">
<br><br>

<input type="tel" id="customerPhone" placeholder="Mobile Number">
<br><br>

<input type="email" id="customerEmail" placeholder="Email (Optional)">
<br><br>

<label><b>Select Product</b></label>

<select id="product">
<option>Shirt</option>
<option>Pant</option>
<option>Suit</option>
<option>Blazer</option>
</select>

<br><br>

<label><b>Select Fabric</b></label>

<select id="fabric">
<option>Pure Cotton</option>
<option>Egyptian Cotton</option>
<option>Linen</option>
<option>Khadi</option>
<option>Oxford</option>
<option>Poplin</option>
<option>Twill</option>
<option>Chambray</option>
<option>Denim</option>
<option>Rayon</option>
<option>Poly Cotton</option>
<option>Polyester</option>
<option>Viscose</option>
<option>Wool</option>
<option>Silk Blend</option>
</select>

<br><br>

<label><b>Select Fit</b></label>

<select id="fit">
<option>Regular Fit</option>
<option>Slim Fit</option>
<option>Comfort Fit</option>
<option>Classic Fit</option>
</select>

<br><br>

<label><b>Shirt Colour</b></label>

<input type="color" id="shirtColor">

<br><br>

<label><b>Pant Colour</b></label>

<input type="color" id="pantColor">

<br><br>

<label><b>Select Size</b></label>

<select id="size">
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
</select>

<br><br>

<h3>OR Manual Measurements</h3>

<input type="number" placeholder="Chest (inches)">
<br><br>

<input type="number" placeholder="Waist (inches)">
<br><br>

<input type="number" placeholder="Shoulder (inches)">
<br><br>

<input type="number" placeholder="Sleeve Length">
<br><br>

<input type="number" placeholder="Pant Length">
<br><br>

<button class="btn" onclick="reviewOrder()">
Review Order
</button>

</div>

</section>

<footer>
<h3>Graduate Tailors</h3>
<p>Since 1991</p>
</footer>

<script>
function reviewOrder(){

const order={
name:document.getElementById("customerName").value,
phone:document.getElementById("customerPhone").value,
email:document.getElementById("customerEmail").value,
product:document.getElementById("product").value,
fabric:document.getElementById("fabric").value,
fit:document.getElementById("fit").value,
size:document.getElementById("size").value,
shirtColor:document.getElementById("shirtColor").value,
pantColor:document.getElementById("pantColor").value
};

localStorage.setItem("graduateOrder",JSON.stringify(order));

window.location.href="review.html";

}
</script>

</body>
</html>
