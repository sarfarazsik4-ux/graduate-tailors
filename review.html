<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graduate Tailors - Order Review</title>
<link rel="stylesheet" href="style.css">

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f4f4;
}

header{
    background:#111;
    color:white;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.logo span{
    color:gold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-size:18px;
}

.container{
    width:90%;
    max-width:900px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    color:#222;
}

.summary p{
    font-size:18px;
    margin:15px 0;
}

.color-box{
    width:25px;
    height:25px;
    display:inline-block;
    border:1px solid #000;
    vertical-align:middle;
    margin-left:10px;
}

.btn{
    width:100%;
    padding:15px;
    background:gold;
    border:none;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    margin-top:25px;
    font-weight:bold;
}

.btn:hover{
    background:#f5c400;
}

.review-section{
    margin-top:50px;
}

.review-card{
    background:#fafafa;
    padding:20px;
    border-radius:10px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.review-card h3{
    margin:0;
}

.stars{
    color:gold;
    font-size:22px;
}

input,textarea{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

.success{
    display:none;
    color:green;
    font-weight:bold;
    margin-top:15px;
}
</style>

</head>

<body>

<header>

<div class="logo">
Graduate <span>Tailors</span>
</div>

<nav>
<a href="index.html">Home</a>
<a href="order.html">Order</a>
<a href="review.html">Reviews</a>
</nav>

</header>

<div class="container">

<h2>Order Summary</h2>

<div class="summary">

<p><b>Name:</b> <span id="customerName">-</span></p>

<p><b>Phone:</b> <span id="customerPhone">-</span></p>

<p><b>Email:</b> <span id="customerEmail">-</span></p>

<p><b>Product:</b> <span id="product">-</span></p>

<p><b>Fabric:</b> <span id="fabric">-</span></p>

<p><b>Fit:</b> <span id="fit">-</span></p>

<p><b>Size:</b> <span id="size">-</span></p>

<p>
<b>Shirt Colour:</b>
<span id="shirtColor" class="color-box"></span>
</p>

<p>
<b>Pant Colour:</b>
<span id="pantColor" class="color-box"></span>
</p>

<button class="btn" onclick="sendWhatsApp()">
📲 Confirm Order on WhatsApp
</button>

</div>

<div class="review-section">

<h2>Customer Reviews</h2>

<div id="reviewsList">

<div class="review-card">
<h3>Rahul Sharma</h3>
<div class="stars">★★★★★</div>
<p>Excellent fitting and premium stitching.</p>
</div>

</div>

<h2>Write Your Review</h2>

<input type="text" id="reviewName" placeholder="Your Name">

<textarea id="reviewText" rows="5" placeholder="Write your review"></textarea>

<button class="btn" onclick="submitReview()">
Submit Review
</button>

<div id="successMessage" class="success">
⭐⭐⭐⭐⭐ Thank you for your review!
</div>

</div>

</div>

<script>

const order = JSON.parse(localStorage.getItem("graduateOrder"));

if(order){

document.getElementById("customerName").textContent=order.name;
document.getElementById("customerPhone").textContent=order.phone;
document.getElementById("customerEmail").textContent=order.email;
document.getElementById("product").textContent=order.product;
document.getElementById("fabric").textContent=order.fabric;
document.getElementById("fit").textContent=order.fit;
document.getElementById("size").textContent=order.size;

document.getElementById("shirtColor").style.backgroundColor=order.shirtColor;
document.getElementById("pantColor").style.backgroundColor=order.pantColor;

}

function sendWhatsApp(){

if(!order){
alert("Please create an order first.");
return;
}

const message=`Graduate Tailors Order

Name: ${order.name}

Phone: ${order.phone}

Email: ${order.email}

Product: ${order.product}

Fabric: ${order.fabric}

Fit: ${order.fit}

Size: ${order.size}`;

window.open("https://wa.me/919801408188?text="+encodeURIComponent(message));

}

function submitReview(){

const name=document.getElementById("reviewName").value;

const review=document.getElementById("reviewText").value;

if(name==="" || review===""){
alert("Please fill all fields.");
return;
}

const card=`

<div class="review-card">

<h3>${name}</h3>

<div class="stars">★★★★★</div>

<p>${review}</p>

</div>

`;

document.getElementById("reviewsList").innerHTML+=card;

document.getElementById("successMessage").style.display="block";

document.getElementById("reviewName").value="";

document.getElementById("reviewText").value="";

}

</script>

</body>
</html>
